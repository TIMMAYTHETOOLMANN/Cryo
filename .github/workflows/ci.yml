name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Run unit tests
        run: forge test -vvv --match-contract CollateralizationDetectorTest

      - name: Run fork tests
        run: forge test -vvv --no-match-contract CollateralizationDetectorTest
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        if: ${{ secrets.MAINNET_RPC_URL != '' }}

version: "3.8"

services:
  arb-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mainnet-arb-executor
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - arb-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: ExpressVPN sidecar for network isolation
  # Uncomment and configure with your ExpressVPN activation code
  # vpn:
  #   image: polkaned/expressvpn
  #   container_name: expressvpn
  #   environment:
  #     - ACTIVATION_CODE=YOUR_EXPRESSVPN_CODE
  #     - SERVER=smart
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun
  #   networks:
  #     - arb-network
  #   restart: unless-stopped

  # When using VPN, update arb-executor to route through it:
  # arb-executor:
  #   network_mode: "service:vpn"
  #   depends_on:
  #     - vpn

networks:
  arb-network:
    driver: bridge

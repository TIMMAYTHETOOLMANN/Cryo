[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@aave/=lib/aave-v3-core/",  # If mocking collateral (e.g., Aave lending)
    "forge-std/=lib/forge-std/src/",
    "reserve-protocol/=lib/reserve-protocol/protocol/contracts/p1/"  # Reserve p1 for RToken/BasketHandler interfaces
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fuzz]
runs = 1000  # For your fuzz phases

[invariant]
runs = 100  # If adding invariant tests later
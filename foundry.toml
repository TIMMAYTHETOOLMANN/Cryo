[profile.default]
src = "."
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@aave/=lib/aave-v3-core/",
    "forge-std/=lib/forge-std/src/",
    "reserve-protocol/=lib/reserve-protocol/protocol/contracts/p1/"
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fuzz]
runs = 1000

[invariant]
runs = 100